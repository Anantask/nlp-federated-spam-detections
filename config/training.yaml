# Centralized and Classical Model Training Configuration
seed: 42

classical_models:
  tfidf:
    max_features: 3000
    ngram_range: [1, 2]
    min_df: 2
    sublinear_tf: true
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
  svm:
    C: 1.0
    loss: "hinge"
    class_weight: "balanced"
    max_iter: 2000

lstm:
  vocab_size: 5000
  embedding_dim: 128
  hidden_dim: 64
  num_layers: 1
  bidirectional: true
  dropout: 0.3
  max_seq_length: 128
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 1e-4
  epochs: 25
  early_stopping_patience: 5

distilbert:
  model_name: "distilbert-base-uncased"
  max_seq_length: 128
  batch_size: 16
  learning_rate: 2e-5
  weight_decay: 0.01
  epochs: 5
  warmup_ratio: 0.1
  device: "auto" # "cuda", "cpu", or "auto"
